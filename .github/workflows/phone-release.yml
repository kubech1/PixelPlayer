name: Build Phone Release APK (ARM64)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phone:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Phone release APK
        run: ./gradlew :app:assembleRelease -Ppixelplay.unsignedRelease=true

      - name: Sign and verify the ARM64 APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.PIXELPLAY_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.PIXELPLAY_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.PIXELPLAY_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.PIXELPLAY_RELEASE_KEY_PASSWORD }}
        run: >-
          bash .github/scripts/sign-release-apk.sh
          app/build/outputs/apk/release/app-release-unsigned.apk
          PixelPlay-phone-release-arm64-v8a.apk

      - name: Upload Phone ARM64 APK
        uses: actions/upload-artifact@v7.0.1
        with:
          path: PixelPlay-phone-release-arm64-v8a.apk
          archive: false
          if-no-files-found: error
